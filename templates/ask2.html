
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF0F5;
            color: #663344;
            margin: 0;
        }

        header {
            background-color: #F4A7C5;
            color: white;
            padding: 10px;
            text-align: center;
        }

        section {
            margin: 30px;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(220, 100, 150, 0.2);
            max-width: 500px;
            margin: auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #F4A7C5;
            border-radius: 8px;
            font-size: 16px;
        }

        input[readonly] {
            background-color: #FFF0F5;
        }

        input[type="submit"],
        input[type="button"] {
            background-color: #F4A7C5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 8px;
        }

        input[type="submit"]:hover,
        input[type="button"]:hover {
            background-color: #E77FA7;
        }
    </style>
</head>
<body>
    <header>
        <h1>字典</h1>
    </header>

    <section>
        <div class="form-box">
            <form action="/ask" method="post">
                <label for="question">中文：</label><br>
                <input type="text" id="question" name="question"
                       value="{{ question }}"><br><br>

                <label for="answer">日文：</label><br>
                <input type="text" id="answer" name="answer"
                       readonly value="{{ answer }}"><br><br>

                <input type="submit" value="送出">
                <input type="button" value="回首頁"
                       onclick="window.location.href='/'">
            </form>
        </div>
    </section>
</body>
</html>
